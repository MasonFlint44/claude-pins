name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for worktree tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: pyte, for the built-in picker's painting test (dev only; the tool is stdlib)
        run: python -m pip install -q pyte
      - name: Unit and end-to-end tests (stub claude, stub fzf — zero Claude usage)
        run: python -m unittest -v
      - name: zsh completion (the Linux runners do not ship zsh)
        run: |
          command -v zsh >/dev/null || sudo apt-get install -y -qq zsh >/dev/null
          zsh tests/zsh_completion_check.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck completions/pin.bash tests/completion_check.sh tests/coverage.sh tests/skills/run.sh tests/skills/triggers.sh tests/terminals/run.sh tests/terminals/wrap.sh

  fzf:
    # The picker's rows and options against real fzf builds: the supported floor, the last release before
    # the tags grew a "v", a mid one, and the newest at the time of writing. tests/test_fzf_real.py fails
    # rather than skips when CLAUDE_PINS_TEST_FZF points at a binary it cannot use.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fzf: ["0.44.1", "0.53.0", "v0.64.0", "v0.74.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fzf ${{ matrix.fzf }}
        run: |
          v="${{ matrix.fzf }}"; v="${v#v}"
          curl -sSL "https://github.com/junegunn/fzf/releases/download/${{ matrix.fzf }}/fzf-${v}-linux_amd64.tar.gz" | tar xz
          ./fzf --version
      - name: pyte, for the cell-for-cell comparison of the built-in picker with this fzf
        run: python -m pip install -q pyte
      - name: Every screen's rows through fzf ${{ matrix.fzf }}
        run: CLAUDE_PINS_TEST_FZF="$PWD/fzf" python -m unittest -v tests.test_fzf_real

  completion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["bash:3.2", "bash:4.4", "bash:5.2"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Completion script parses and completes on ${{ matrix.image }}
        run: bash tests/completion_check.sh
